<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bean Bag Toss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --ink: #fff6e6;
    --muted: #cbbfd9;
    --blue: #3b82e6;
    --blue-soft: #9cc2ff;
    --red: #e5483d;
    --red-soft: #ffa59d;
    --gold: #ffc94a;
    --gold-deep: #b07a17;
    --panel: rgba(14, 16, 38, 0.72);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #0b0f22;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; overflow: hidden; background: #121633; }
  #stage.framed { border-radius: 20px; box-shadow: 0 30px 90px rgba(0,0,0,.65); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: absolute; left: 0; top: 0; width: 400px; height: 640px; transform-origin: 0 0; pointer-events: none; }
  #ui button, #ui input, #ui .live { pointer-events: auto; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  .hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: stretch; }
  .team {
    flex: 1; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 14px;
    background: rgba(10, 12, 30, .58);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 2px solid rgba(255,255,255,.07);
    transition: border-color .3s, box-shadow .3s, transform .3s;
  }
  .team.red { flex-direction: row-reverse; text-align: right; }
  .team.blue { color: var(--blue-soft); }
  .team.red { color: var(--red-soft); }
  .team.active { border-color: currentColor; transform: translateY(1px); }
  .team.blue.active { box-shadow: 0 0 22px rgba(59,130,230,.45); }
  .team.red.active { box-shadow: 0 0 22px rgba(229,72,61,.45); }
  .team .score { font-family: 'Lilita One', sans-serif; font-size: 34px; line-height: 1; color: #fff; min-width: 30px; text-align: center; }
  .team .meta { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .team .name { font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pips { display: flex; gap: 4px; }
  .team.red .pips { justify-content: flex-end; }
  .pip { width: 10px; height: 10px; border-radius: 3px; background: currentColor; opacity: .22; transition: opacity .3s, transform .3s; }
  .pip.on { opacity: 1; }
  .inning { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 4px; font-size: 11px; font-weight: 800; color: var(--muted); }
  .inning b { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 24px; color: var(--gold); line-height: 1.05; }

  .turn {
    position: absolute; top: 84px; left: 0; right: 0; text-align: center;
    font-weight: 900; font-size: 15px; letter-spacing: .01em;
    text-shadow: 0 2px 10px rgba(0,0,0,.7);
  }
  .turn .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }

  .hint {
    position: absolute; top: 108px; left: 0; right: 0; text-align: center;
    font-size: 13px; font-weight: 800; color: var(--muted); opacity: .85;
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
    transition: opacity .5s;
  }
  .corner { position: absolute; bottom: 14px; display: flex; gap: 8px; }
  .corner.left { left: 14px; } .corner.right { right: 14px; }
  .chip {
    font: 800 13px 'Nunito', sans-serif; color: var(--ink);
    background: rgba(10,12,30,.55); border: 1.5px solid rgba(255,255,255,.18);
    padding: 8px 13px; border-radius: 999px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .chip:active { transform: scale(.96); }

  .toast {
    position: absolute; top: 200px; left: 0; right: 0; text-align: center;
    font-family: 'Lilita One', sans-serif; font-size: 50px; line-height: 1;
    opacity: 0; pointer-events: none;
  }
  .toast small { display: block; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 18px; margin-top: 6px; }
  .toast.show { animation: pop 1.6s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .toast.hole { color: var(--gold); text-shadow: 0 4px 0 #9c4f12, 0 0 34px rgba(255,201,74,.7); font-size: 60px; }
  .toast.board { color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 20px rgba(255,255,255,.3); }
  .toast.off { color: #d6cbe4; text-shadow: 0 3px 0 rgba(0,0,0,.5); font-size: 40px; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.4) rotate(-8deg); }
    14% { opacity: 1; transform: scale(1.14) rotate(-3deg); }
    28% { transform: scale(1) rotate(-3deg); }
    78% { opacity: 1; transform: scale(1) rotate(-3deg) translateY(0); }
    100% { opacity: 0; transform: scale(.96) rotate(-3deg) translateY(-24px); }
  }

  /* ---------- Screens & panels ---------- */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: 0 30px;
  }
  #menu { background: linear-gradient(180deg, rgba(8,10,28,.05) 0%, rgba(8,10,28,.2) 45%, rgba(8,10,28,.86) 72%); }
  .title {
    margin: 120px 0 0; text-align: center;
    font-family: 'Lilita One', sans-serif; font-weight: 400;
    font-size: 64px; line-height: .92; color: #ffe7b8;
    transform: rotate(-4deg);
    text-shadow: 0 2px 0 #e9a64a, 0 4px 0 #c27a2c, 0 6px 0 #8f4f1c, 0 10px 18px rgba(0,0,0,.55), 0 0 40px rgba(255,190,90,.35);
  }
  .title span { display: block; font-size: 86px; color: var(--gold); }
  .tagline { margin-top: 18px; font-weight: 800; font-size: 14px; color: var(--muted); text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .menu-actions { margin-top: auto; margin-bottom: 34px; width: 100%; display: flex; flex-direction: column; gap: 11px; }
  .btn {
    font: 900 17px 'Nunito', sans-serif; width: 100%; padding: 15px 18px;
    border-radius: 14px; border: none; cursor: pointer;
    background: var(--gold); color: #2a1a06;
    box-shadow: 0 5px 0 var(--gold-deep), 0 10px 20px rgba(0,0,0,.35);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.35); }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.28); }
  .btn.ghost:active { transform: translateY(2px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .rules { font-size: 12.5px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.45; margin: 4px 0 0; }

  .panel {
    position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%);
    background: var(--panel); border: 1.5px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-radius: 22px; padding: 24px 22px 22px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .panel h2 { margin: 0 0 6px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.05; }
  .panel p { margin: 0 0 14px; font-weight: 700; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
  .panel .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .code {
    font-family: 'Lilita One', sans-serif; font-size: 54px; letter-spacing: .14em; color: var(--gold);
    margin: 6px 0 10px; text-shadow: 0 4px 0 #8f4f1c;
    padding-left: .14em;
  }
  input.code-input {
    width: 100%; font: 400 38px 'Lilita One', sans-serif; letter-spacing: .2em; text-align: center; text-transform: uppercase;
    background: rgba(0,0,0,.35); color: var(--gold); border: 2px solid rgba(255,255,255,.2);
    border-radius: 14px; padding: 10px 6px; padding-left: .2em; outline: none;
  }
  .err { color: #ffb4a8; font-weight: 800; font-size: 13.5px; min-height: 18px; margin-top: 8px; }
  .inning-lines { display: flex; justify-content: center; gap: 22px; margin: 12px 0 8px; }
  .inning-lines div { font-weight: 900; font-size: 15px; }
  .inning-lines b { display: block; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 40px; color: #fff; }
  .big-result { font-family: 'Lilita One', sans-serif; font-size: 22px; color: var(--gold); }
  .final-score { font-family: 'Lilita One', sans-serif; font-size: 46px; margin: 4px 0 6px; }
  .final-score .b { color: var(--blue-soft); } .final-score .r { color: var(--red-soft); }

  @media (prefers-reduced-motion: reduce) {
    .toast.show { animation-duration: .01s; opacity: 1; animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="ui">
    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div class="hud">
        <div class="team blue" id="teamBlue">
          <div class="score" id="scoreBlue">0</div>
          <div class="meta"><div
