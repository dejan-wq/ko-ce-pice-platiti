  --bg:#141C2E; --surface:#1D2740; --surface2:#253152; --ink:#EEF1F7; --muted:#98A3BC;
  --line:#2F3B5C; --field:#111827; --brass:#D4A857; --brass-ink:#1A1408; --accent:#E07A5F; --ok:#5FB49C;

@media (prefers-color-scheme: light){
  :host{--bg:#EEF1F6;--surface:#FFFFFF;--surface2:#F5F7FB;--ink:#18223A;--muted:#5E6A84;--line:#DCE2EC;--field:#FFFFFF;--brass:#B8893A;--brass-ink:#FFFFFF}
}
*,*::before,*::after{box-sizing:inherit}
.gbody{min-height:calc(100vh - 132px);min-height:calc(100dvh - 132px);margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:"DM Serif Display",Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(36px,10vw,50px);line-height:1.02;letter-spacing:-.01em;margin:4px 0 8px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 24px}
h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:26px;margin:44px 0 14px;color:var(--ink)}
.row{display:flex;gap:10px}
input{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;transition:border-color .15s}
input::placeholder{color:var(--muted);opacity:.8}
input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 25%,transparent)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:12px 18px}
button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.btn-add{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;min-height:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 4px 5px 12px;font-weight:600;font-size:15px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip button{background:transparent;color:var(--muted);padding:2px 8px;border-radius:999px;font-size:14px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}

.wheel-wrap{position:relative;width:min(100%,400px);aspect-ratio:1;margin:30px auto 0;border-radius:50%;box-shadow:0 18px 40px -12px #0008}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--brass);filter:drop-shadow(0 3px 3px #0006);z-index:2;transform-origin:50% 0}
.pointer.wiggle{animation:wig .12s ease-in-out}
@keyframes wig{50%{transform:translateX(-50%) rotate(-12deg)}}
.hub{position:absolute;inset:0;margin:auto;width:20%;height:20%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3D491,#B8893A 60%,#8A6425);box-shadow:0 2px 8px #0007,inset 0 1px 1px #fff6;display:grid;place-items:center;color:#1A1408;font-family:"DM Serif Display",Georgia,serif;font-size:clamp(22px,7vw,32px)}
.spin-row{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:26px}
.btn-spin{background:var(--brass);color:var(--brass-ink);font-size:18px;letter-spacing:.01em;padding:15px 40px;border-radius:14px;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--brass) 70%,transparent);transition:transform .1s,filter .15s}
.btn-spin:hover{filter:brightness(1.06)}
.btn-spin:active{transform:translateY(1px)}
.btn-spin:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-sound{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:18px;padding:12px 14px}
.quip{text-align:center;color:var(--muted);min-height:1.5em;margin:14px 0 0;font-size:15px}

.empty{color:var(--muted);padding:6px 0}
.btn-reset{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:18px;font-size:14px;font-weight:600;padding:9px 14px}
.leader{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:16px;padding:18px;margin-bottom:14px;text-align:center;color:var(--muted);font-size:14px}
.leader b{font-family:"DM Serif Display",Georgia,serif;font-weight:400;color:var(--ink);font-size:28px;display:block;margin:4px 0 2px;word-break:break-word}
.leader .big{color:var(--brass);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.person{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.person.top{border-color:color-mix(in srgb,var(--brass) 60%,var(--line))}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p-name{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;min-width:0}
.p-name .dot{width:10px;height:10px;border-radius:50%;flex:none}
.p-total{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-meta{color:var(--muted);font-size:13px;margin:2px 0 10px}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;border-radius:99px}
.bills{list-style:none;padding:0;margin:0}
.bills li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.bills .when{color:var(--muted);font-size:12px;display:block}
.bills .amt{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.bills button{background:transparent;color:var(--muted);padding:4px 8px;font-size:13px}
.status{color:var(--muted);font-size:12px;text-align:center;margin-top:34px}

.modal{position:fixed;inset:0;background:#070B14B3;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.open{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:20px;padding:26px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 60px -20px #000a;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card .loser{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(34px,10vw,44px);line-height:1.1;color:var(--brass);margin:4px 0 6px;word-break:break-word}
.card p{margin:0 0 18px;color:var(--muted);font-size:15px}
.card label{color:var(--ink)}
.btn-save{background:var(--brass);color:var(--brass-ink)}
.btn-skip{background:transparent;color:var(--muted);margin-top:8px;font-weight:600;font-size:14px}
.money{position:relative;flex:1}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money input{padding-left:32px;font-size:18px;font-weight:700}
.modes{display:flex;gap:8px;align-items:center;margin-top:26px}
.seg{display:flex;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;background:transparent;color:var(--muted);padding:10px 8px;border-radius:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brass) 55%,transparent)}
.touch{position:relative;margin-top:18px;height:min(64vh,540px);min-height:340px;border-radius:22px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(circle at 50% 45%,var(--surface2),var(--surface) 70%);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.touch canvas{position:absolute;inset:0;width:100%;height:100%}
.touch-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none;color:var(--muted);font-size:15px;transition:opacity .2s}
.touch-msg b{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:28px;color:var(--ink);display:block;margin-bottom:6px}
.picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px}
.picker button{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.picker button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:11}

.ts-app{
  --ink:#12263F; --ink2:#1D3A5C; --sea:#0F8B8D; --seaSoft:#E3F4F4; --seaDark:#0B6567;
  --coral:#D1495B; --coralSoft:#FBE9EC; --sun:#B7791F; --sunSoft:#FDF3DC;
  --mist:#EDF1F5; --line:#E1E7EE; --muted:#64748B;
  height:100vh; height:100dvh; background:var(--mist); color:var(--ink);
}
.ts-sheet{ max-height:92vh; max-height:92dvh; }
.ts-app input,.ts-app select{ font-size:16px; }
.ts-app button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.ts-scroll::-webkit-scrollbar{ display:none; }

summary::-webkit-details-marker{ display:none; }
.ts-card{ background:#fff; border:1px solid var(--line); border-radius:18px; }
.ts-input{ width:100%; background:#fff; border:1px solid #CBD5E1; border-radius:14px; padding:0 16px; height:48px; color:var(--ink); }
.ts-input::placeholder{ color:#94A3B8; }
.ts-input:focus{ outline:none; border-color:var(--sea); box-shadow:0 0 0 3px rgba(15,139,141,.18); }
.ts-label{ display:block; font-size:14px; font-weight:600; color:#334155; margin-bottom:8px; }
.ts-hint{ font-size:12px; color:var(--muted); margin-top:8px; }

.ts-btn{ width:100%; height:52px; border-radius:14px; background:var(--ink); color:#fff; font-size:16px; font-weight:600; }
.ts-btn:active{ background:var(--ink2); }
.ts-btn:disabled{ background:#CBD5E1; color:#94A3B8; }
.ts-btn-sm{ height:48px; padding:0 20px; border-radius:14px; background:var(--ink); color:#fff; font-weight:600; flex-shrink:0; }
.ts-btn-ghost{ height:44px; padding:0 16px; border-radius:12px; border:1px solid #CBD5E1; color:#334155; font-weight:500; background:#fff; }
.ts-btn-sea{ height:44px; padding:0 16px; border-radius:12px; background:var(--seaSoft); border:1px solid #B7E0E1; color:var(--seaDark); font-weight:600; }
.ts-btn-danger{ width:100%; height:48px; border-radius:14px; border:1px solid #F3C4CB; color:var(--coral); font-weight:500; background:#fff; }

.ts-chip{ height:40px; padding:0 16px; border-radius:999px; border:1px solid #CBD5E1; color:#475569; font-size:14px; white-space:nowrap; background:#fff; }
.ts-chip-on{ border-color:var(--sea); background:var(--seaSoft); color:var(--seaDark); font-weight:600; }

.ts-seg{ display:grid; gap:4px; background:#E3E9EF; padding:4px; border-radius:14px; }
.ts-seg button{ height:40px; border-radius:10px; font-size:14px; color:var(--muted); }
.ts-seg button.on{ background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.1); }

.ts-fab{ background:var(--sea); color:#fff; box-shadow:0 8px 20px rgba(15,139,141,.35); }
.ts-fab:active{ background:var(--seaDark); }

.ts-pass{ background:var(--ink); color:#fff; border-radius:22px; position:relative; }
.ts-pass-cut{ position:relative; margin:0 14px; border-top:2px dashed rgba(255,255,255,.22); }
.ts-pass-cut::before,.ts-pass-cut::after{ content:''; position:absolute; top:-12px; width:22px; height:22px; border-radius:50%; background:var(--mist); }
.ts-pass-cut::before{ left:-25px; }
